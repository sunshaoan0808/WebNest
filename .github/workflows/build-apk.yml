name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Apply custom launcher icon
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.START_URL }}
        run: |
          if [ -n "$APP_URL" ]; then
            curl -fsSL --max-time 30 "$APP_URL/pwa-512x512.png" -o /tmp/icon.png
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              dir="${d%%:*}"; size="${d##*:}"
              convert /tmp/icon.png -resize "${size}x${size}" \
                "android/app/src/main/res/mipmap-${dir}/ic_launcher.png"
            done
          fi

      - name: Assemble debug APK
        working-directory: android
        env:
          APP_URL: ${{ secrets.START_URL }}
          APP_NAME: ${{ secrets.APP_NAME }}
        run: |
          gradle assembleDebug --no-daemon \
            -PserverUrl="${APP_URL:-https://example.com}" \
            -PappName="${APP_NAME:-WebNest}"

      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk webnest-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: webnest-debug-apk
          path: webnest-debug.apk
          retention-days: 3
